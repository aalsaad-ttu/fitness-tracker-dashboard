<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fitness Tracker Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
      line-height: 1.6;
    }

    h1, h2 {
      margin-bottom: 10px;
    }

    input {
      padding: 10px;
      margin: 5px 5px 10px 0;
      width: 200px;
    }

    button {
      padding: 10px 16px;
      cursor: pointer;
    }

    ul {
      padding-left: 20px;
    }

    li {
      margin-bottom: 8px;
    }

    .total-box {
      margin-top: 20px;
      font-size: 1.2rem;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>Fitness Tracker Dashboard</h1>
  <p>Track your meals and calories throughout the day.</p>

  <h2>Add Meal</h2>

  <input type="text" id="mealName" placeholder="Meal name" />
  <input type="number" id="calories" placeholder="Calories" />
  <button onclick="addMeal()">Add Meal</button>

  <h2>Meals</h2>
  <ul id="mealList"></ul>

  <div class="total-box">
    Total Calories: <span id="total">0</span>
  </div>

  <script>
    let totalCalories = 0;

    function addMeal() {
      const mealInput = document.getElementById("mealName");
      const caloriesInput = document.getElementById("calories");
      const meal = mealInput.value.trim();
      const calories = parseInt(caloriesInput.value);

      if (meal === "" || isNaN(calories) || calories < 0) {
        alert("Please enter a valid meal name and calorie amount.");
        return;
      }

      const li = document.createElement("li");
      li.textContent = meal + " - " + calories + " calories";
      document.getElementById("mealList").appendChild(li);

      totalCalories += calories;
      document.getElementById("total").textContent = totalCalories;

      mealInput.value = "";
      caloriesInput.value = "";
    }
  </script>
</body>
</html>
